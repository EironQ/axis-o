# ============================================
# AXIS O - Nginx 配置文件
# ============================================
# 使用说明：
# 1. 将此文件保存为 /etc/nginx/sites-available/axis-o
# 2. 创建软链接: ln -s /etc/nginx/sites-available/axis-o /etc/nginx/sites-enabled/
# 3. 修改下面的域名、路径和 SSL 证书路径
# 4. 执行: nginx -t && systemctl reload nginx
# ============================================

# HTTP -> HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt 证书验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务器
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ============================================
    # SSL 证书配置
    # ============================================
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL 安全设置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS (可选，首次配置建议注释掉，确认没问题后再启用)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ============================================
    # 日志配置
    # ============================================
    access_log /var/log/nginx/axis-o.access.log;
    error_log /var/log/nginx/axis-o.error.log;

    # ============================================
    # 前端静态文件
    # ============================================
    root /var/www/axis-o/client/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/vnd.ms-fontobject application/x-font-ttf font/opentype;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML 不缓存（确保部署后即时生效）
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA 路由支持 - 所有请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================
    # API 反向代理
    # ============================================
    location /api {
        # 代理到后端服务
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket 支持（如需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 请求头传递
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 文件上传大小限制（如果后端有上传功能）
        client_max_body_size 50M;

        proxy_cache_bypass $http_upgrade;
    }

    # 后端健康检查端点
    location /api/health {
        proxy_pass http://127.0.0.1:3001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ============================================
    # 上传文件目录（如果后端有文件上传）
    # ============================================
    location /uploads {
        alias /var/www/axis-o/server/uploads;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ============================================
    # 管理后台（可选，限制访问）
    # ============================================
    # location /admin {
    #     # IP 白名单（取消注释并修改为你的 IP）
    #     # allow 192.168.1.0/24;
    #     # deny all;
    #
    #     try_files $uri $uri/ /index.html;
    # }

    # ============================================
    # 安全设置
    # ============================================
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问敏感文件
    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|conf|bak)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问 Node.js 构建目录
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ============================================
    # 错误页面
    # ============================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# ============================================
# 性能优化 - 上游 Keepalive
# ============================================
upstream backend {
    server 127.0.0.1:3001;
    keepalive 32;
}
